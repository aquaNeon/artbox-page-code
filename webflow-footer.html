<!-- ============================================================
     Artbox page transitions — PART 2 of 2

     Paste into: Webflow → Site Settings → Custom Code → FOOTER CODE
     (renders before </body>)

     Order matters. page-transition.js runs on parse: it queries
     .footer_wrap / .page_wrap and calls barba.init(), so it needs
     the libraries above it and a built DOM below the head.

     Remove the old Webflow-hosted GSAP tag, it will fight this one.
     ============================================================ -->

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.3/dist/barba.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.17/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/MadeYouLookAB/base-lib@main/code-base/form-validation.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/MadeYouLookAB/base-lib@main/code-base/match-container.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/MadeYouLookAB/base-lib@main/code-base/video-min.js"></script>
