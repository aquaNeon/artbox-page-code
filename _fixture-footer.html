<!doctype html>
<!-- Local fixture for the desktop footer reveal and its parallax. Not part
     of the site: run `node dev-server.js` and open
     http://localhost:5180/_fixture-footer.html
     The readout in the corner prints the numbers the trigger is built from.
     Wider than 991px — below it the footer is in flow and nothing moves. -->
<html lang="en" data-barba="wrapper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footer reveal fixture</title>
<link rel="stylesheet" href="/page-transition.css">
<style>
  body { margin: 0; font-family: Georgia, serif; background: #f6f5f2; color: #14110f; }

  /* The page has to paint its own background or the fixed footer shows
     through it, exactly as on the site. */
  .page_wrap { background: #f6f5f2; position: relative; z-index: 2; }
  .block { height: 80vh; display: flex; align-items: center; justify-content: center;
           font-size: 3rem; border-bottom: 1px solid #14110f22; }

  .footer_wrap { background: #14110f; color: #f6f5f2; }
  .footer_inner { padding: 4rem 6vw; display: grid; gap: 3rem; }
  .footer_logo { font-size: clamp(4rem, 12vw, 10rem); line-height: .9; margin: 0; }
  .footer_links { display: flex; gap: 2rem; font: 16px/1 system-ui, sans-serif; }
  .footer_legal { font: 13px/1 system-ui, sans-serif; opacity: .6; }

  .readout { position: fixed; top: 0; left: 0; z-index: 99; background: #000; color: #0f0;
             font: 12px/1.5 ui-monospace, monospace; padding: .75rem 1rem; white-space: pre; }
</style>
</head>
<body>

<main class="page_wrap" data-barba="container" data-barba-namespace="home">
  <div class="block">scroll down — the footer is fixed behind this</div>
  <div class="block">two</div>
  <div class="block">three</div>
  <div class="block">last block, the reveal starts under it</div>
</main>

<footer class="footer_wrap">
  <div class="footer_inner">
    <p class="footer_logo">ARTBOX</p>
    <div class="footer_links"><span>Tjenester</span><span>Arbeid</span><span>Om oss</span><span>Kontakt</span></div>
    <div class="footer_legal">© 2026 — the whole inside should lag behind the reveal</div>
  </div>
</footer>

<div class="readout" id="readout"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
<script src="/kugiri.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.3/dist/barba.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.17/dist/lenis.min.js"></script>
<script src="/page-transition.js"></script>

<script>
  const out = document.getElementById('readout');
  const footer = document.querySelector('.footer_wrap');
  const inner = document.querySelector('.footer_inner');
  const page = document.querySelector('.page_wrap');

  function tick() {
    const max = ScrollTrigger.maxScroll(window);
    const fh = footer.offsetHeight;
    const vh = window.innerHeight;
    const y = new DOMMatrixReadOnly(getComputedStyle(inner).transform).m42;
    const st = ScrollTrigger.getAll().filter(t => t.trigger === document.documentElement);
    const revealed = Math.min(1, Math.max(0, (window.scrollY - (max - fh)) / fh));

    out.textContent = [
      `scrollY   ${Math.round(window.scrollY)}`,
      `maxScroll ${Math.round(max)}`,
      `vh        ${vh}`,
      `footer h  ${fh}`,
      `page mb   ${page.style.marginBottom || '(none)'}`,
      `inner y   ${y.toFixed(1)}`,
      `revealed  ${(revealed * 100).toFixed(0)}%`,
      st.length ? `ST start  ${Math.round(st[0].start)}  end ${Math.round(st[0].end)}  progress ${(st[0].progress * 100).toFixed(0)}%`
                : 'ST        none on documentElement'
    ].join('\n');
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
